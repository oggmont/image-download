# Shipped defaults. Do NOT put real URLs, cookies or tokens here: this file is committed.
# Put your own values in download.local.properties (git-ignored) in the project root,
# or copy download.local.properties.example.
#
# {n} is replaced with the zero-padded number (padding=4 -> 0000, 0001, ... 0999).

url.template=https://test.com/media/b/r/name/1000/brewi_{n}.jpg
file.template=name_{n}.jpg
start=0
end=999
padding=4
output.dir=downloads
delay.ms=300

# true = replace files that already exist (original behaviour); false = skip them (resume a run)
overwrite=true
# extra attempts on network errors, HTTP 429 and 5xx (404 is never retried)
retries=2
timeout.seconds=30
# 0 = never stop early; e.g. 20 = stop after 20 missing numbers in a row
stop.after.misses=0

# Optional request headers / cookies:
# header.User-Agent=Mozilla/5.0
# header.Referer=https://test.com/
# cookie.session_id=...
