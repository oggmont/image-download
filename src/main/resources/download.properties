# Shipped defaults. Do NOT put real URLs, cookies or tokens here: this file is committed.
# Put your own values in download.local.properties (git-ignored) in the project root,
# or copy download.local.properties.example.
#
# The window (DownloaderApp) fills its four inputs from url.template, file.template, start and end,
# and remembers what you last typed in ui.local.properties.
#
# {n} is replaced with the zero-padded number (padding=4 -> 0000, 0001, ... 0999).

url.template=https://test.com/media/b/r/name/1000/image_{n}.jpg
file.template=name_{n}.jpg
start=0
end=999
padding=4
output.dir=downloads

# Pause between requests: delay.ms plus a random 0..delay.jitter.ms (default 1.5 to 3.0 s).
delay.ms=1500
delay.jitter.ms=1500

# true = replace files that already exist (original behaviour); false = skip them (resume a run)
overwrite=true
# extra attempts on network errors, HTTP 429 and 5xx (404 is never retried)
retries=2
timeout.seconds=30
# 0 = never stop early; e.g. 20 = stop after 20 missing numbers in a row
stop.after.misses=0

# One line per request is appended here (relative to the working directory). "none" turns it off.
log.file=download-requests.log

# Optional HTTP proxy, host:port (e.g. a VPN's or Tor's local HTTP proxy) so the site doesn't see your IP.
# proxy=127.0.0.1:8118

# Requests already send a generic browser User-Agent, Accept and Accept-Language (see DownloadConfig).
# Override or add headers / cookies like this:
# header.User-Agent=Mozilla/5.0 ...
# header.Referer=https://test.com/
# cookie.session_id=...
